# Compila el instalador y la versión portable en Windows y los publica en la Release de la etiqueta.
name: Compilar para Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar instalador y portable
        run: npx electron-builder --win --x64 --publish never

      - name: Armar ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force entrega/PuntoDeVenta | Out-Null
          Copy-Item dist/*.exe entrega/PuntoDeVenta/
          Copy-Item LEEME.md entrega/PuntoDeVenta/LEEME.txt
          Compress-Archive -Path entrega/PuntoDeVenta -DestinationPath "entrega/PuntoDeVenta-$version-Windows.zip"
          "ZIP=entrega/PuntoDeVenta-$version-Windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: PuntoDeVenta-Windows
          path: ${{ env.ZIP }}

      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Punto de Venta ${GITHUB_REF_NAME#v}" --notes "Compilado en Windows."
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
